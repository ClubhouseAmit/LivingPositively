name: Release Android to Google Play internal testing

# Called by .github/workflows/main.yml, which gates it on push-to-main and on
# quality + coverage-aggregate having passed.
#
# `environment: google-play-internal` is where the Play and signing secrets
# should be scoped — a protected environment can also require a reviewer before
# anything reaches the store.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  release-android-internal:
    runs-on: ubuntu-latest
    environment: google-play-internal
    timeout-minutes: 15
    steps:
      - name: Download App Bundle
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/bundle/release

      - name: Publish to Google Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.matzilon.mezilon
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
