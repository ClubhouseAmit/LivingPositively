name: Cloud Functions tests and production audit

# Called by .github/workflows/main.yml. Needs no secrets.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  functions-test:
    name: Cloud Functions tests and production audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci

      - name: Run Functions tests
        run: npm test

      - name: Test Functions deployment change detection
        run: >-
          node --test ../scripts/tests/functions_deployment_changes.test.mjs
          ../scripts/tests/check_firestore_rules_drift.test.mjs
          ../scripts/tests/check_firestore_collection_policy.test.mjs

      - name: Test iOS Google Sign-In pre-build configuration
        run: bash ../scripts/tests/prepare_ios_google_sign_in_config_test.sh

      - name: Verify Firestore collection policy coverage
        run: node ../scripts/check_firestore_collection_policy.mjs

      - name: Audit production dependencies
        # Production deployment must remain free of known audit findings.
        run: npm audit --omit=dev --audit-level=low
