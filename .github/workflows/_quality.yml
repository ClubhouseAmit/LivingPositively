name: Code quality

# Called by .github/workflows/main.yml. Needs no secrets.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHECK_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The guideline checker resolves a merge-base against CHECK_BASE_REF.
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test guideline checker
        run: tool/check_guidelines_test.sh

      - name: Analyze
        run: flutter analyze

      - name: Check changed Dart files
        run: tool/check_guidelines.sh
