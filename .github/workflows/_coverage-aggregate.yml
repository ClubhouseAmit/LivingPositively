name: Aggregate coverage gate

# Called by .github/workflows/main.yml. Needs no secrets.
#
# Phase 8 (ADR-003): merges unit lcov and Android-integration lcov, enforces
# the ADR-004 89% global floor on the union.
#
# The caller runs this with `if: always()` and hands in the upstream results
# and artifact IDs, because a called workflow cannot read the caller's `needs`
# context. The first step fails fast when either dependency did not succeed, so
# this job's status is always one of {success, failure} — never "skipped". A
# skipped required check can be treated as success by branch protection, which
# would let a PR with a failed upstream merge with this gate looking green.
#
# The existing gates are UNCHANGED:
#   build-android    → check_coverage.dart             (85% unit/global floor)
#   integration-test → check_integration_coverage.dart (per-file floors)
# This job is purely additive; removing it restores the Phase 7 state.
on:
  workflow_call:
    inputs:
      build-result:
        description: result of build-android in the caller.
        required: true
        type: string
      integration-result:
        description: result of integration-test in the caller.
        required: true
        type: string
      unit-coverage-artifact-id:
        description: coverage-lcov artifact ID from build-android.
        required: false
        default: ""
        type: string
      integration-coverage-artifact-id:
        description: coverage-integration-lcov artifact ID from integration-test.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  coverage-aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify all upstream jobs succeeded
        # Fail fast if any dependency did not succeed. We check the results
        # explicitly rather than relying on `needs:` to skip — see the file
        # header for why a skipped required check is unsafe.
        env:
          BUILD_RESULT: ${{ inputs.build-result }}
          INTEGRATION_RESULT: ${{ inputs.integration-result }}
          UNIT_COVERAGE_ARTIFACT_ID: ${{ inputs.unit-coverage-artifact-id }}
          INTEGRATION_COVERAGE_ARTIFACT_ID: ${{ inputs.integration-coverage-artifact-id }}
        run: |
          echo "build-android result:        $BUILD_RESULT"
          echo "integration-test result:     $INTEGRATION_RESULT"
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::Upstream job build-android did not succeed (result=$BUILD_RESULT); cannot compute aggregate coverage." >&2
            exit 1
          fi
          if [ "$INTEGRATION_RESULT" != "success" ]; then
            echo "::error::Upstream job integration-test did not succeed (result=$INTEGRATION_RESULT); cannot compute aggregate coverage." >&2
            exit 1
          fi
          # Empty artifact-ids would download every artifact instead.
          if [ -z "$UNIT_COVERAGE_ARTIFACT_ID" ] || [ -z "$INTEGRATION_COVERAGE_ARTIFACT_ID" ]; then
            echo "::error::Successful upstream jobs must provide their coverage artifact IDs." >&2
            exit 1
          fi
          echo "All upstream jobs succeeded — proceeding with aggregate merge."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          cache: true

      - name: Install dependencies
        shell: bash
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/dart-config"
          mkdir -p "$XDG_CONFIG_HOME"
          echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME" >> "$GITHUB_ENV"
          for attempt in 1 2 3; do
            echo "Installing Dart dependencies (attempt ${attempt}/3)."
            if flutter pub get; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              delay=$((attempt * 15))
              echo "::warning::flutter pub get failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          exit 1

      - name: Download unit coverage artifact
        # A rerun must consume its successful producers' exact artifacts,
        # not an older attempt's same-name upload. Publishers also overwrite
        # prior artifacts so v4's latest-by-name listing cannot hide this ID.
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.unit-coverage-artifact-id }}
          merge-multiple: true
          path: coverage

      - name: Download integration coverage artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.integration-coverage-artifact-id }}
          merge-multiple: true
          path: coverage

      - name: Merge unit and Android-integration lcov files
        # Merges coverage/lcov.info (unit) and coverage/integration.info
        # (Android intg) into coverage/aggregate.info by taking the max
        # hit-count per line — same semantics as the ADR-001 Phase-6 merge
        # step. Output path is distinct from all inputs so no upstream
        # gate is clobbered.
        #
        # ADR-006 §"Quality gate shape": coverage/integration_ios.info is
        # NO LONGER merged here. The iOS job is telemetry-only and not an
        # input to this workflow, so the artifact may be absent or stale.
        # Restore the iOS input alongside re-promoting the iOS job.
        run: dart run scripts/merge_lcov.dart coverage/aggregate.info coverage/lcov.info coverage/integration.info

      - name: Enforce aggregate coverage gate
        # check_aggregate_coverage.dart reads coverage/lcov.info and
        # coverage/integration.info directly (parseLcovInputs), applies the
        # same exclude list as check_coverage.dart, and enforces the 89%
        # aggregate global floor (originally 85% under ADR-003 Phase 8;
        # ratcheted to 89% by ADR-004 Phase 9 after the firestore-injection
        # extension in firebase_functions.dart pushed unit-only coverage
        # to 89.33% — see docs/coverage-status.md § Round 9).
        #
        # ADR-006 §"Quality gate shape": the iOS lcov was a third input
        # under ADR-005 § A (Phase 10A) but is no longer merged here while
        # the iOS job is telemetry-only. Removing an additive input cannot
        # lower the union; the 89% floor stays safe.
        run: dart run scripts/check_aggregate_coverage.dart

      - name: Upload aggregate coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-aggregate-lcov
          path: coverage/aggregate.info
