name: Notification backend quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  functions-test:
    name: Cloud Functions tests and production audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Use the Functions npm version
        run: |
          npm_version=$(node -p 'require("./package.json").engines.npm')
          npm install --global "npm@$npm_version"
          test "$(npm --version)" = "$npm_version"

      - name: Install Functions dependencies
        run: npm ci

      - name: Run Functions tests
        run: npm test

      - name: Verify the installed security patches
        run: npm run verify:dependencies

      - name: Test backend deployment guards
        run: >-
          node --test ../scripts/tests/functions_deployment_changes.test.mjs
          ../scripts/tests/check_firestore_rules_drift.test.mjs
          ../scripts/tests/check_firestore_collection_policy.test.mjs
          scripts/verify_dependency_graph.test.mjs

      - name: Test iOS Google Sign-In pre-build configuration
        run: bash ../scripts/tests/prepare_ios_google_sign_in_config_test.sh

      - name: Verify Firestore collection policy coverage
        run: node ../scripts/check_firestore_collection_policy.mjs

      - name: Replay managed Functions build and production audit
        run: npm run gcp-build

  firestore-rules-test:
    name: Firestore security rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: "21.x"

      - name: Use the Functions npm version
        run: |
          npm_version=$(node -p 'require("./functions/package.json").engines.npm')
          npm install --global "npm@$npm_version"
          test "$(npm --version)" = "$npm_version"

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Verify the installed security patches
        run: npm --prefix functions run verify:dependencies

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.32.1

      - name: Verify Firestore rules against the emulator
        run: npm --prefix functions run test:rules
