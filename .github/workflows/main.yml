name: "Build production artifacts"
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main-release-pipeline' || format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This file is the pipeline GRAPH ONLY — who runs, what they need, what they
# hand on. Every job BODY lives in its own `_*.yml` reusable workflow, so this
# stays readable on one screen. Keep it that way: steps do not belong here.
#
# A job that calls a reusable workflow may only carry:
#   name, uses, with, secrets, strategy, needs, if, concurrency, permissions
# `env`, `environment`, `timeout-minutes`, `runs-on` and `outputs` are NOT
# allowed here — they live in the called file. (GitHub: "Supported keywords for
# jobs that call a reusable workflow".)
#
# A called workflow cannot see the caller's `needs` context, so anything a job
# used to read from `needs.*.result` / `needs.*.outputs.*` is passed in
# explicitly via `with:` below. If you add a dependency, pass its result too or
# the downstream gate silently stops checking it.
jobs:
  quality:
    uses: ./.github/workflows/_quality.yml

  backend-quality:
    uses: ./.github/workflows/_backend-quality.yml

  build-android:
    uses: ./.github/workflows/_android-build.yml
    secrets: inherit

  integration-test-shard:
    # ADR-010: keep each Android integration entry point in its own runner so
    # repeated native builds cannot exhaust one runner's disk. The matrix
    # itself lives in the called file (the inventory gate parses it there).
    needs: build-android
    uses: ./.github/workflows/_android-shard.yml
    secrets: inherit

  integration-test-inventory:
    # Runs beside the emulator shards so matrix drift fails without extending
    # the canonical coverage gate's critical path.
    uses: ./.github/workflows/_android-inventory.yml

  integration-test:
    # Phase 7 (ADR-002) required-check contract, implemented as the canonical
    # ADR-010 merge and per-file coverage gate for the Android shard matrix.
    #
    # `if: always()` + the passed-in results is deliberate: with bare `needs:`
    # alone GitHub SKIPS this job when an upstream fails, and a skipped
    # required check can be read as success by branch protection. Forcing the
    # job to run and failing it on a bad upstream result keeps its status
    # always one of {success, failure} — never "skipped".
    needs: [integration-test-shard, integration-test-inventory]
    if: ${{ always() }}
    uses: ./.github/workflows/_android-coverage.yml
    with:
      shard-result: ${{ needs.integration-test-shard.result }}
      inventory-result: ${{ needs.integration-test-inventory.result }}

  integration-test-ios:
    # TELEMETRY-ONLY (ADR-006 §"Quality gate shape") — green-on-failure and
    # deliberately absent from coverage-aggregate's needs. No `needs:` here
    # either: it starts immediately and gates nothing.
    uses: ./.github/workflows/_ios-integration.yml
    secrets: inherit

  coverage-aggregate:
    # Phase 8 (ADR-003): merges unit + Android-integration lcov and enforces
    # the ADR-004 89% global floor on the union. Same `always()` reasoning as
    # integration-test above.
    #
    # ADR-006: integration-test-ios is NOT an input. The iOS lcov was additive
    # to the union (max hit-count per line), so dropping it cannot lower the
    # floor's safety margin. Re-add it here if that job is re-promoted.
    needs: [build-android, integration-test]
    if: ${{ always() }}
    uses: ./.github/workflows/_coverage-aggregate.yml
    with:
      build-result: ${{ needs.build-android.result }}
      integration-result: ${{ needs.integration-test.result }}
      unit-coverage-artifact-id: ${{ needs.build-android.outputs.coverage-artifact-id }}
      integration-coverage-artifact-id: ${{ needs.integration-test.outputs.coverage-artifact-id }}

  notification-backend:
    needs: [coverage-aggregate, backend-quality]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/_notification-backend.yml
    with:
      coverage-result: ${{ needs.coverage-aggregate.result }}
      backend-quality-result: ${{ needs.backend-quality.result }}
    secrets: inherit

  release-android-internal:
    name: Release Android to Google Play internal testing
    # `quality` is in this list on purpose: without it a run that fails
    # `flutter analyze` or tool/check_guidelines.sh could still reach Play.
    needs:
      [
        quality,
        build-android,
        coverage-aggregate,
        backend-quality,
        integration-test-ios,
        notification-backend,
      ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: google-play-internal-release
      cancel-in-progress: false
    uses: ./.github/workflows/_android-release.yml
    secrets: inherit
