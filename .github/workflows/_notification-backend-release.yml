name: Release notification backend

# Called by .github/workflows/main.yml after application and Functions tests
# have passed. Production credentials are scoped to firebase-production.
on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  notification-backend-plan:
    name: Plan notification backend release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      required: ${{ steps.changes.outputs.required }}
      functions_required: ${{ steps.changes.outputs.functions_required }}
      content_required: ${{ steps.changes.outputs.content_required }}
      rules_required: ${{ steps.changes.outputs.rules_required }}
    steps:
      - name: Checkout tested revision and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Detect changes since the last successful main run
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/main.yml/runs" \
            -f branch=main -f event=push -f status=success -f per_page=100 \
            > "$RUNNER_TEMP/functions-successful-runs.json"
          node scripts/functions_deployment_changes.mjs "$RUNNER_TEMP/functions-successful-runs.json"

  notification-backend-release:
    name: Release changed notification backend
    runs-on: ubuntu-latest
    needs: notification-backend-plan
    if: needs.notification-backend-plan.outputs.required == 'true'
    timeout-minutes: 30
    environment: firebase-production
    env:
      FIREBASE_PROJECT_ID: mezilondb
    steps:
      - name: Checkout tested revision and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Check deployment credential configuration
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FUNCTIONS_RELEASE_REQUIRED: ${{ needs.notification-backend-plan.outputs.functions_required }}
          NOTIFICATION_MUTATION_FENCE_CLIENT_ROLLOUT_APPROVED: ${{ vars.NOTIFICATION_MUTATION_FENCE_CLIENT_ROLLOUT_APPROVED }}
        run: node scripts/validate_firebase_deployment_config.mjs

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Reject deployment of a superseded main revision
        run: |
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "::error::main has advanced. Use its new workflow run instead of deploying this older revision."
            exit 1
          fi

      - name: Authenticate Firebase deployment
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          token_format: "access_token"

      - name: Install Firebase CLI
        if: >-
          needs.notification-backend-plan.outputs.functions_required == 'true' ||
          needs.notification-backend-plan.outputs.rules_required == 'true'
        run: npm install --global firebase-tools@15.29.0

      # ADR-015 makes rules a hard predecessor. Provisioning and the scheduler
      # write collections whose access policy this step establishes.
      - name: Deploy Firestore rules to mezilondb
        if: needs.notification-backend-plan.outputs.rules_required == 'true'
        run: >-
          firebase deploy --only firestore:rules
          --project "$FIREBASE_PROJECT_ID" --non-interactive

      # The repository is the single writer for production rules. A mismatch
      # means a console edit would be silently reverted by this release.
      - name: Verify deployed rules match the repository
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/check_firestore_rules_drift.mjs

      - name: Provision changed notification content
        if: needs.notification-backend-plan.outputs.content_required == 'true'
        run: npm --prefix functions run provision:notifications -- --project "$FIREBASE_PROJECT_ID"

      - name: Deploy Functions to mezilondb
        if: needs.notification-backend-plan.outputs.functions_required == 'true'
        # firebase.json builds TypeScript via predeploy. No --force: unexpected
        # function deletions must fail for review instead of being auto-approved.
        run: firebase deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive

  notification-backend-gate:
    name: Verify notification backend release
    runs-on: ubuntu-latest
    needs: [notification-backend-plan, notification-backend-release]
    if: always()
    steps:
      - name: Verify required backend work completed
        env:
          PLAN_RESULT: ${{ needs.notification-backend-plan.result }}
          RELEASE_REQUIRED: ${{ needs.notification-backend-plan.outputs.required }}
          RELEASE_RESULT: ${{ needs.notification-backend-release.result }}
        run: |
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::Notification backend change detection did not succeed."
            exit 1
          fi
          if [ "$RELEASE_REQUIRED" = "true" ] && [ "$RELEASE_RESULT" != "success" ]; then
            echo "::error::Required notification backend release did not succeed."
            exit 1
          fi
          if [ "$RELEASE_REQUIRED" != "true" ] && [ "$RELEASE_RESULT" != "skipped" ]; then
            echo "::error::Unexpected notification backend release result."
            exit 1
          fi
