name: iOS integration telemetry

# Called by .github/workflows/main.yml.
#
# Phase 10A (ADR-005 § A) ORIGINALLY made this a required input to the
# aggregate coverage gate. ADR-006 §"Quality gate shape" downgrades it to
# TELEMETRY-ONLY — `continue-on-error: true` on the test step and the per-file
# floor step make the job green-on-failure, and the job is NOT in the caller's
# coverage-aggregate dependency set. This mirrors the unit-test-web-telemetry
# treatment (now parked in disabled-web.yml).
#
# Rationale: the optimized job still runs on the critical path's slowest
# hardware (macOS + simulator + native iOS build). Keeping it blocking would
# stall every PR on macOS-runner availability and simulator/Xcode flakes. The
# iOS lcov was only ever additive to the union floor (max hit-count per line),
# so removing it from the aggregate input set cannot lower the 89% floor's
# safety margin.
#
# ADR-006 benchmarks this job on macos-15 arm64: it still provides Xcode 16 /
# iOS 18 SDK symbols required by flutter_contacts' iOS Contacts
# limited-permission support without forcing the newer macos-26 / Xcode 26
# toolchain onto this coverage job. macOS runners are free for public
# repositories under GitHub's open-source billing, so the ADR-002 / Round-9
# macOS-cost framing that previously deferred iOS coverage no longer applies.
#
# The job continues to:
#   1. Run notifications and breathing persistence on the iOS simulator.
#   2. Compute per-file lcov for the iOS arms of NotificationsService.
#   3. Evaluate scripts/check_ios_integration_coverage.dart (60% floor on
#      lib/pages/notifications/notification_service.dart) as JOB-INTERNAL
#      telemetry — its failure no longer blocks the workflow.
#   4. Upload `coverage-integration-ios-lcov` and `ios-podfile-lock` artifacts
#      for PR reviewers and ADR-006 §Podfile.lock follow-up.
#
# Re-flipping to blocking: drop the two `continue-on-error: true` lines below
# AND add integration-test-ios to coverage-aggregate's needs + inputs in
# main.yml AND restore the iOS branch in check_aggregate_coverage.dart.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  integration-test-ios:
    runs-on: macos-15
    # Telemetry must still be time-bounded. GitHub's default job timeout is
    # 360 minutes, which lets a stuck `flutter test` monopolize the macOS
    # runner long after the blocking gates have completed.
    timeout-minutes: 60
    env:
      FIREBASE_OPTIONS_PATH: lib/util/Firebase/firebase_options.dart
      IOS_PODS_CACHE_VERSION: v1
      IOS_DERIVED_DATA_CACHE_VERSION: v1
      # cloud_firestore 6.4.1's SwiftPM manifest allows firebase-ios-sdk
      # 12.14.0, whose Firestore pipeline bridge changed initializer
      # signatures. Keep this iOS coverage job on the CocoaPods path until
      # FlutterFire updates cloud_firestore's iOS parser for that API.
      FLUTTER_SWIFT_PACKAGE_MANAGER: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write firebase options file
        env:
          FIREBASE_OPTIONS: ${{ secrets.FIREBASE_OPTIONS }}
        run: |
          printf '%s' "$FIREBASE_OPTIONS" | base64 --decode > "${{ env.FIREBASE_OPTIONS_PATH }}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          cache: true

      - name: Install dependencies
        shell: bash
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/dart-config"
          mkdir -p "$XDG_CONFIG_HOME"
          echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME" >> "$GITHUB_ENV"
          for attempt in 1 2 3; do
            echo "Installing Dart dependencies (attempt ${attempt}/3)."
            if flutter pub get; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              delay=$((attempt * 15))
              echo "::warning::flutter pub get failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          exit 1

      - name: Capture Xcode version for cache keys
        id: xcode
        run: |
          xcodebuild -version
          XCODE_CACHE_KEY=$(xcodebuild -version | tr '\n' '-' | sed -E 's/-$//' | tr ' ' '_')
          echo "cache_key=$XCODE_CACHE_KEY" >> "$GITHUB_OUTPUT"

      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.cache_key }}-ios-pods-${{ env.IOS_PODS_CACHE_VERSION }}-${{ hashFiles('pubspec.lock', 'ios/Podfile', 'ios/Podfile.lock', '.flutter-plugins-dependencies') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.cache_key }}-ios-pods-${{ env.IOS_PODS_CACHE_VERSION }}-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.cache_key }}-ios-deriveddata-${{ env.IOS_DERIVED_DATA_CACHE_VERSION }}-${{ hashFiles('pubspec.lock', 'ios/Podfile', 'ios/Podfile.lock', '.flutter-plugins-dependencies', 'ios/Runner.xcodeproj/project.pbxproj', 'ios/Runner.xcworkspace/contents.xcworkspacedata') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.cache_key }}-ios-deriveddata-${{ env.IOS_DERIVED_DATA_CACHE_VERSION }}-

      - name: List available iOS simulators
        # Diagnostic: surfaces the runtime + device names available on the
        # macos-15 image. If the next step fails to find an iPhone, the
        # output here is the first place to look.
        run: xcrun simctl list devices available

      - name: Boot iPhone simulator
        # macos-15 images ship with multiple iPhone simulators.
        # — pick the first "iPhone " device that is available. Avoid pinning
        # to a specific model so the job survives when GitHub rotates the
        # default Xcode/iOS-runtime bundle.
        timeout-minutes: 10
        run: |
          DEVICE_LINE=$(xcrun simctl list devices available | grep -E '^\s+iPhone ' | head -n 1)
          DEVICE_ID=$(echo "$DEVICE_LINE" | awk -F '[()]' '{print $2}')
          DEVICE_NAME=$(echo "$DEVICE_LINE" | sed -E 's/^\s+//; s/ \(.*//')
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No iPhone simulator found on this macos-15 runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $DEVICE_NAME ($DEVICE_ID)"
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
          xcrun simctl boot "$DEVICE_ID"
          # bootstatus blocks until the sim is fully booted (springboard up).
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Run iOS integration test with diagnostics
        # Notes on the invocation below (mirrors the Android job's design
        # rationale in _android-shard.yml):
        #
        # 1. Single-line `flutter test` — no `\<newline>` continuations.
        # 2. `-d "$DEVICE_ID"` explicitly targets the booted simulator. Without
        #    `-d`, Flutter sometimes falls back to host-VM mode which
        #    re-triggers "Integration tests and unit tests cannot be run in a
        #    single invocation."
        # 3. SENTRY_DSN dart-define is a synthetic test value — Sentry's
        #    native SDK never reaches the network because the channel is
        #    mocked inside the test setUp. Symmetric with the Android job.
        # 4. Run the iOS notification test and platform-neutral breathing
        #    persistence test, not the whole `integration_test/` directory.
        #    The other integration tests
        #    (bootstrap_smoke, wellness_player, logger_init,
        #    notifications_schedule) are Android-targeted and have no value
        #    on iOS. Running them on iOS would either pass tautologically
        #    (because they use debugDefaultTargetPlatformOverride) or fail
        #    due to Android-specific channel-mock assumptions.
        # `continue-on-error: true` is INTENTIONAL — see the file header.
        # Failures here are telemetry, not gating. Do not remove without also
        # adding integration-test-ios to coverage-aggregate in main.yml and
        # restoring the iOS branch in check_aggregate_coverage.dart.
        continue-on-error: true
        timeout-minutes: 45
        run: |
          mkdir -p ci-ios-diagnostics
          {
            echo "=== date ==="
            date -u
            echo
            echo "=== selected simulator ==="
            echo "$DEVICE_ID"
            xcrun simctl list "$DEVICE_ID"
            echo
            echo "=== flutter devices -v ==="
            flutter devices -v
          } > ci-ios-diagnostics/preflight.txt 2>&1 || true

          xcrun simctl spawn "$DEVICE_ID" log stream \
            --style compact \
            --level debug \
            --predicate 'process == "Runner" OR process == "SpringBoard" OR eventMessage CONTAINS "Flutter" OR eventMessage CONTAINS "Observatory" OR eventMessage CONTAINS "VMService"' \
            > ci-ios-diagnostics/simulator.log 2>&1 &
          SIM_LOG_PID=$!

          (
            sleep 2400
            {
              echo "=== iOS test watchdog fired at 40 minutes ==="
              date -u
              echo
              echo "=== process snapshot ==="
              ps -axo pid,ppid,etime,command | grep -E 'flutter|dart|xcodebuild|simctl|Runner|ios-deploy' | grep -v grep || true
              echo
              echo "=== simulator state ==="
              xcrun simctl list "$DEVICE_ID"
            } > ci-ios-diagnostics/watchdog.txt 2>&1
            xcrun simctl io "$DEVICE_ID" screenshot ci-ios-diagnostics/watchdog-screenshot.png > ci-ios-diagnostics/watchdog-screenshot.txt 2>&1 || true
            mkdir -p ci-ios-diagnostics/DiagnosticReports
            find ~/Library/Logs/DiagnosticReports -type f -mtime -1 -exec cp {} ci-ios-diagnostics/DiagnosticReports/ \; 2>/dev/null || true
          ) &
          WATCHDOG_PID=$!

          cleanup_ios_diagnostics() {
            kill "$SIM_LOG_PID" "$WATCHDOG_PID" 2>/dev/null || true
          }
          trap cleanup_ios_diagnostics EXIT

          set +e
          flutter --verbose test integration_test/notifications_schedule_ios_test.dart integration_test/remember_to_breathe_test.dart --no-pub --coverage --coverage-path coverage/integration_ios.info --dart-define=SENTRY_DSN=https://test@dsn.example.local/0 -d "$DEVICE_ID" 2>&1 | tee ci-ios-diagnostics/flutter-test.log
          TEST_EXIT=${PIPESTATUS[0]}
          set -e

          {
            echo "=== flutter test exit ==="
            echo "$TEST_EXIT"
            echo
            echo "=== date ==="
            date -u
            echo
            echo "=== process snapshot ==="
            ps -axo pid,ppid,etime,command | grep -E 'flutter|dart|xcodebuild|simctl|Runner|ios-deploy' | grep -v grep || true
            echo
            echo "=== simulator state ==="
            xcrun simctl list "$DEVICE_ID"
          } > ci-ios-diagnostics/post-test.txt 2>&1 || true
          xcrun simctl io "$DEVICE_ID" screenshot ci-ios-diagnostics/post-test-screenshot.png > ci-ios-diagnostics/post-test-screenshot.txt 2>&1 || true
          mkdir -p ci-ios-diagnostics/DiagnosticReports
          find ~/Library/Logs/DiagnosticReports -type f -mtime -1 -exec cp {} ci-ios-diagnostics/DiagnosticReports/ \; 2>/dev/null || true

          exit "$TEST_EXIT"

      - name: Upload iOS integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-integration-diagnostics
          path: ci-ios-diagnostics
          if-no-files-found: warn

      - name: Upload iOS Podfile lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-podfile-lock
          path: ios/Podfile.lock
          if-no-files-found: warn

      - name: Enforce iOS per-file coverage floor (telemetry — non-blocking)
        # `continue-on-error: true` is INTENTIONAL — see the file header.
        # The per-file floor is preserved as job-internal signal so PR
        # reviewers can spot iOS-coverage regressions in the workflow log,
        # but it does not gate the workflow until ADR-006's runtime
        # objective is met and the job is re-promoted to blocking.
        continue-on-error: true
        run: dart run scripts/check_ios_integration_coverage.dart

      - name: Upload iOS integration coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration-ios-lcov
          path: coverage/integration_ios.info
          if-no-files-found: warn
