name: Notification backend release

on:
  workflow_call:
    inputs:
      coverage-result:
        description: Result of the aggregate coverage workflow.
        required: true
        type: string
      backend-quality-result:
        description: Result of the backend quality workflow.
        required: true
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: Plan notification backend release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      required: ${{ steps.changes.outputs.required }}
      functions_required: ${{ steps.changes.outputs.functions_required }}
      content_required: ${{ steps.changes.outputs.content_required }}
      rules_required: ${{ steps.changes.outputs.rules_required }}
    steps:
      - name: Verify tested predecessors
        env:
          COVERAGE_RESULT: ${{ inputs.coverage-result }}
          BACKEND_QUALITY_RESULT: ${{ inputs.backend-quality-result }}
        run: |
          if [ "$COVERAGE_RESULT" != "success" ] || [ "$BACKEND_QUALITY_RESULT" != "success" ]; then
            echo "::error::Notification backend release requires successful coverage and backend quality checks."
            exit 1
          fi

      - name: Checkout tested revision and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Detect changes since the last successful main run
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/main.yml/runs" \
            -f branch=main -f event=push -f status=success -f per_page=100 \
            > "$RUNNER_TEMP/functions-successful-runs.json"
          node scripts/functions_deployment_changes.mjs "$RUNNER_TEMP/functions-successful-runs.json"

  release:
    name: Release changed notification backend
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.required == 'true'
    timeout-minutes: 30
    environment: firebase-production
    env:
      FIREBASE_PROJECT_ID: mezilondb
    steps:
      - name: Checkout tested revision and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Check deployment credential configuration
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FUNCTIONS_RELEASE_REQUIRED: ${{ needs.plan.outputs.functions_required }}
          NOTIFICATION_MUTATION_FENCE_CLIENT_ROLLOUT_APPROVED: ${{ vars.NOTIFICATION_MUTATION_FENCE_CLIENT_ROLLOUT_APPROVED }}
        run: node scripts/validate_firebase_deployment_config.mjs

      - name: Use the Functions npm version
        run: |
          npm_version=$(node -p 'require("./functions/package.json").engines.npm')
          npm install --global "npm@$npm_version"
          test "$(npm --version)" = "$npm_version"

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Verify the installed security patches
        run: npm --prefix functions run verify:dependencies

      - name: Reject deployment of a superseded main revision
        run: |
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "::error::main has advanced. Use its new workflow run instead of deploying this older revision."
            exit 1
          fi

      - name: Authenticate Firebase deployment
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          token_format: access_token

      - name: Install Firebase CLI
        if: needs.plan.outputs.functions_required == 'true' || needs.plan.outputs.rules_required == 'true'
        run: npm install --global firebase-tools@15.32.1

      - name: Deploy Firestore rules
        if: needs.plan.outputs.rules_required == 'true'
        run: >-
          firebase deploy --only firestore:rules
          --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Verify deployed rules match the repository
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/check_firestore_rules_drift.mjs

      - name: Provision changed notification content
        if: needs.plan.outputs.content_required == 'true'
        run: npm --prefix functions run provision:notifications -- --project "$FIREBASE_PROJECT_ID"

      - name: Deploy Functions
        if: needs.plan.outputs.functions_required == 'true'
        run: firebase deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Record managed-build evidence requirement
        if: always() && needs.plan.outputs.functions_required == 'true'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Managed Functions build evidence
          The managed `gcp-build` hook must verify Node 22/npm 11.14.0, compile TypeScript,
          prune development dependencies, verify Gaxios/UUID 11.1.1 and Firestore/gRPC
          1.14.5, and pass the production audit before deployment can succeed.
          Retain the Cloud Build ID, source revision and log with the release record.
          CI's local replay does not establish that this managed build ran.
          App rollout remains blocked until the managed evidence in
          `functions/SECURITY.md` and real-account checks in `docs/auth-provider-rollout.md` exist.
          EOF

  gate:
    name: Verify notification backend release
    runs-on: ubuntu-latest
    needs: [plan, release]
    if: always()
    steps:
      - name: Verify required backend work completed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RELEASE_REQUIRED: ${{ needs.plan.outputs.required }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::Notification backend change detection did not succeed."
            exit 1
          fi
          if [ "$RELEASE_REQUIRED" = "true" ] && [ "$RELEASE_RESULT" != "success" ]; then
            echo "::error::Required notification backend release did not succeed."
            exit 1
          fi
          if [ "$RELEASE_REQUIRED" != "true" ] && [ "$RELEASE_RESULT" != "skipped" ]; then
            echo "::error::Unexpected notification backend release result."
            exit 1
          fi
